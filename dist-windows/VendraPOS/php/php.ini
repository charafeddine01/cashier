[PHP]
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zlib.output_compression = Off
implicit_flush = Off
serialize_precision = -1
zend.enable_gc = On
max_execution_time = 300
max_input_time = 120
memory_limit = 256M
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = "logs/php_errors.log"
default_mimetype = "text/html"
default_charset = "UTF-8"

; Extension Directory
extension_dir = "ext"
enable_dl = Off
file_uploads = On
upload_max_filesize = 64M
max_file_uploads = 20
post_max_size = 64M

; Windows Extensions
extension=curl
extension=fileinfo
extension=mbstring
extension=openssl
extension=pdo_sqlite
extension=sqlite3
extension=sodium
extension=zip

[curl]
curl.cainfo = "cacert.pem"

[openssl]
openssl.cafile = "cacert.pem"

[Date]
date.timezone = "Asia/Beirut"
